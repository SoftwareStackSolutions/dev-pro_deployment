name: ACC Pull Request Validation

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source Branch (Example: release/v1.0.2 or hotfix/login-fix)"
        required: true
        type: string


permissions:
  contents: write
  pull-requests: write
  security-events: write


jobs:

  acc-validation:

    name: ACC Java Build, Test & Scan

    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: acc


    steps:

      #################################################################
      # Checkout Repository
      #################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0


      #################################################################
      # Validate Source Branch
      #################################################################

      - name: Validate Source Branch
        run: |

          echo "Source Branch: ${{ inputs.source_branch }}"

          if [[ ! "${{ inputs.source_branch }}" =~ ^(release|hotfix)/ ]]; then

            echo "Only release/* or hotfix/* branches are allowed."

            exit 1

          fi



      #################################################################
      # Configure Git
      #################################################################

      - name: Configure Git
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin \
          https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git



      #################################################################
      # Create Version Tag
      #################################################################

      - name: Create Version Tag
        run: |

          BRANCH="${{ inputs.source_branch }}"


          if [[ "$BRANCH" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then


            TAG="${BASH_REMATCH[1]}"


            echo "Creating Tag: $TAG"


            git fetch --tags


            if git rev-parse "$TAG" >/dev/null 2>&1; then

              echo "Tag '$TAG' already exists."

              exit 1

            fi


            git tag "$TAG"

            git push origin "$TAG"


            echo "Tag created successfully."


          else

            echo "Hotfix branch detected. Tag creation skipped."

          fi



      #################################################################
      # Setup Java
      #################################################################

      - name: Setup Java
        uses: actions/setup-java@v4
        with:

          distribution: temurin

          java-version: '17'

          cache: maven



      #################################################################
      # Initialize CodeQL
      #################################################################

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3

        with:

          languages: java



      #################################################################
      # Maven Validate
      #################################################################

      - name: Maven Validate
        working-directory: spring-petclinic
        run: mvn validate



      #################################################################
      # Compile Application
      #################################################################

      - name: Compile Application
        working-directory: spring-petclinic
        run: mvn clean compile



      #################################################################
      # Unit Test
      #################################################################

      - name: Run Unit Tests
        working-directory: spring-petclinic
        run: mvn test



      #################################################################
      # Package JAR
      #################################################################

      - name: Package Application
        working-directory: spring-petclinic
        run: mvn package -DskipTests



      #################################################################
      # Upload JAR Artifact
      #################################################################

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4

        with:

          name: spring-boot-jar

          path: spring-petclinic/target/*.jar



      # #################################################################
      # # SonarQube Scan
      # #################################################################

      # - name: SonarQube Scan
      #   uses: SonarSource/sonarqube-scan-action@v6

      #   env:

      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      #   with:

      #     args: >

      #       -Dsonar.projectKey=acc-deployment

      #       -Dsonar.projectName=acc-deployment

      #       -Dsonar.sources=spring-petclinic/src



      #################################################################
      # CodeQL Analysis
      #################################################################

      - name: Perform CodeQL Analysis

        uses: github/codeql-action/analyze@v3



      #################################################################
      # Create Pull Request to ACC
      #################################################################

      - name: Create Pull Request to ACC

        env:

          GH_TOKEN: ${{ secrets.GH_PAT }}


        run: |

          echo "Checking existing PR..."


          PR_EXISTS=$(gh pr list \
          --base Acc \
          --head "${{ inputs.source_branch }}" \
          --state open \
          --json number \
          --jq 'length')


          if [ "$PR_EXISTS" -gt 0 ]; then

            echo "Pull Request already exists."

            exit 0

          fi



          gh pr create \
          --base Acc \
          --head "${{ inputs.source_branch }}" \
          --title "Release: ${{ inputs.source_branch }} → Acc" \
          --body "

          ## ACC Release Validation

          Source Branch:
          ${{ inputs.source_branch }}

          Target Branch:
          Acc


          Validation Completed:

          Please review and merge this PR.
          "
