name: ACC Pull Request Validation

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source Branch (Example: release/v1.0.2 or hotfix/login-fix)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan (ACC)
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: acc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      - name: Validate Source Branch
        run: |
          echo "Source Branch: ${{ inputs.source_branch }}"

          if [[ ! "${{ inputs.source_branch }}" =~ ^(release|hotfix)/ ]]; then
            echo "❌ Only release/* or hotfix/* branches are allowed."
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

      - name: Create Version Tag
        run: |
          BRANCH="${{ inputs.source_branch }}"
      
          # Only create tags for release branches
          if [[ "$BRANCH" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
      
            TAG="${BASH_REMATCH[1]}"
      
            echo "Release Branch : $BRANCH"
            echo "Version Tag    : $TAG"
      
            git fetch --tags
      
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "❌ Tag '$TAG' already exists."
              exit 1
            fi
      
            echo "Creating tag $TAG"
      
            git tag "$TAG"
            git push origin "$TAG"
      
            echo "✅ Tag '$TAG' created successfully."
      
          else
            echo "Hotfix branch detected. Skipping version tag creation."
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ACC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.ACC_AWS_REGION }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=acc-deployment
            -Dsonar.projectName=acc-deployment
            -Dsonar.sources=.
            -Dsonar.exclusions=.terraform/**,**/*.tfstate,**/*.tfstate.backup,**/.terraform.lock.hcl

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Identify Environment
        run: |
          echo "Environment: $ENVIRONMENT"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-acc
          path: tfplan
          
      - name: Create Pull Request to ACC
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Checking if PR already exists..."

          PR_EXISTS=$(gh pr list \
            --base Acc \
            --head "${{ inputs.source_branch }}" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$PR_EXISTS" -gt 0 ]; then
            echo "Pull Request already exists."
            exit 0
          fi

          echo "Creating Pull Request..."

          gh pr create \
            --base Acc \
            --head "${{ inputs.source_branch }}" \
            --title "Release: ${{ inputs.source_branch }} → Acc" \
            --body "
          ## ACC Release

          **Source Branch:** \`${{ inputs.source_branch }}\`

          **Target Branch:** \`Acc\`

          ### Validation Completed

          - ✅ SonarQube Scan
          - ✅ Terraform Format Check
          - ✅ Terraform Validate
          - ✅ Terraform Plan

          Please review and merge this PR.
          "
