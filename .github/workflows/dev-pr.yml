name: DEV Pull Request Validation

on:
  pull_request:
    branches:
      - Dev

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Validate, Scan & Plan
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: dev

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java (Required for Sonar Scanner)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      #################################################################
      # Authenticate to AWS
      #################################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      #################################################################
      # SonarQube Scan (EC2 Hosted)
      #################################################################
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=dev-pro_deployment
            -Dsonar.projectName=dev-pro_deployment
            -Dsonar.sources=.
            -Dsonar.exclusions=.terraform/**,**/*.tfstate,**/*.tfstate.backup,**/.terraform.lock.hcl

      #################################################################
      # Terraform
      #################################################################
      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      #################################################################
      # Identify Environment
      #################################################################
      - name: Identify Environment
        run: echo "Deploying to $ENVIRONMENT"

      #################################################################
      # Terraform Plan
      #################################################################
      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -var-file=environments/dev.tfvars \
            -out=tfplan

      #################################################################
      # Upload Plan (Optional)
      #################################################################
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
