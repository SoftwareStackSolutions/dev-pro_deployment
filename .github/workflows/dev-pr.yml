name: DEV Pull Request Validation

on:
  pull_request:
    branches:
      - Dev

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  java-validation:
    name: Java Build, Test & Scan
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: dev

    steps:
      #################################################################
      # Checkout Repository
      #################################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################################
      # Validate Source Branch
      #################################################################
      - name: Validate Source Branch
        run: |
          echo "Source Branch: ${{ github.head_ref }}"

          if [[ ! "${{ github.head_ref }}" =~ ^(feature|hotfix)/ ]]; then
            echo "Only feature/* or hotfix/* branches can create a PR into Dev."
            exit 1
          fi

      #################################################################
      # Setup Java
      #################################################################
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      #################################################################
      # Initialize CodeQL
      #################################################################
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      #################################################################
      # Maven Validate
      #################################################################
      - name: Maven Validate
        working-directory: spring-petclinic
        run: mvn validate
      #################################################################
      # Compile
      #################################################################
      - name: Compile Application
        working-directory: spring-petclinic
        run: mvn clean compile

      #################################################################
      # Run JUnit Tests
      #################################################################
      - name: Run Unit Tests
        working-directory: spring-petclinic
        run: mvn test

      #################################################################
      # Package Application
      #################################################################
      - name: Package JAR
        working-directory: spring-petclinic
        run: mvn package -DskipTests

      #################################################################
      # Upload JAR Artifact
      #################################################################
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar

      #################################################################
      # SonarQube Scan
      #################################################################
      # - name: SonarQube Scan
      #   uses: SonarSource/sonarqube-scan-action@v6
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #   with:
      #     args: >
      #       -Dsonar.projectKey=dev-pro_deployment
      #       -Dsonar.projectName=dev-pro_deployment
      #       -Dsonar.sources=src

      #################################################################
      # CodeQL Analysis
      #################################################################
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
