name: ACC Pull Request Validation

on:
  pull_request:
    branches:
      - Acc

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan (ACC)
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: acc

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # Allow only release/* branches
      - name: Validate Source Branch
        run: |
          echo "Source Branch: ${{ github.head_ref }}"

          if [[ ! "${{ github.head_ref }}" =~ ^release\/ ]]; then
            echo "Only release/* branches can create PR into ACC."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ACC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.ACC_AWS_REGION }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Identify Environment
        run: echo "Environment : $ENVIRONMENT"

      - name: Terraform Plan
        run: |
          terraform plan \
          -input=false \
          -var-file=environments/acc.tfvars \
          -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-acc
          path: tfplan
