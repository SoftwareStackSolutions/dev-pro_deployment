name: DEV Deployment

on:
  push:
    branches:
      - Dev

permissions:
  contents: write
  packages: write

env:
  JAVA_VERSION: "17"
  APP_NAME: spring-petclinic
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  deploy-dev:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:

      ####################################################################
      # Checkout Repository
      ####################################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################################
      # Setup Java
      ####################################################################
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      ####################################################################
      # Build Application
      ####################################################################
      - name: Maven Clean
        working-directory: spring-petclinic
        run: mvn clean

      - name: Maven Package
        working-directory: spring-petclinic
        run: mvn package -DskipTests

      ####################################################################
      # Upload Build Artifact (GitHub Artifact)
      ####################################################################
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-petclinic-${{ env.APP_VERSION }}
          path: spring-petclinic/target/*.jar

      ####################################################################
      # Configure Maven Settings for Nexus
      ####################################################################
      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      ####################################################################
      # Publish Artifact to Nexus Repository
      ####################################################################
      - name: Publish JAR to Nexus
        working-directory: spring-petclinic
        run: |
          mvn deploy \
            -DskipTests \
            -DaltDeploymentRepository=nexus::${{ secrets.NEXUS_URL }}/repository/maven-snapshots-dev/

      ####################################################################
      # Configure AWS Credentials
      ####################################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      ####################################################################
      # Login to Amazon ECR
      ####################################################################
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ####################################################################
      # Build Docker Image
      ####################################################################
      - name: Build Docker Image
        working-directory: spring-petclinic
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.APP_VERSION }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest .

      ####################################################################
      # Push Docker Image
      ####################################################################
      - name: Push Docker Image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.APP_VERSION }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          
     ####################################################################
      # Configure EKS
      ####################################################################
      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.DEV_AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}
            
      ####################################################################
      # Install ArgoCD (Idempotent)
      ####################################################################
      
      - name: Create ArgoCD Namespace
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Install / Update ArgoCD
        run: |
          kubectl apply --server-side -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      
      - name: Wait for ArgoCD Server
        run: |
          kubectl rollout status deployment/argocd-server \
            -n argocd \
            --timeout=300s
      
      - name: Show ArgoCD Credentials
        run: |
          echo "=================================="
          echo "ARGOCD URL      : https://localhost:8080"
          echo "ARGOCD USERNAME : admin"
      
          PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d 2>/dev/null || true)
      
          if [ -n "$PASSWORD" ]; then
            echo "ARGOCD PASSWORD : $PASSWORD"
          else
            echo "ARGOCD PASSWORD : Secret not found."
          fi
      
          echo "=================================="
