name: ACC Release Validation

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release Branch (Example: release/v1.0.2)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-create-pr:
    name: Validate Release & Create ACC PR
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: acc

    steps:
      - name: Checkout Release Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_branch }}
          fetch-depth: 0

      - name: Validate Release Branch
        run: |
          echo "Branch: ${{ github.event.inputs.release_branch }}"

          if [[ ! "${{ github.event.inputs.release_branch }}" =~ ^(release|hotfix)/ ]]; then
            echo "Only release/* or hotfix/* branches are allowed."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACC_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ACC_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.ACC_AWS_REGION }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=acc-deployment
            -Dsonar.projectName=acc-deployment
            -Dsonar.sources=.
            -Dsonar.exclusions=.terraform/**,**/*.tfstate,**/*.tfstate.backup,**/.terraform.lock.hcl

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Identify Environment
        run: |
          echo "Environment: $ENVIRONMENT"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-acc
          path: tfplan

      - name: Create Pull Request to ACC
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: Acc
          branch: ${{ github.event.inputs.release_branch }}
          title: "Release ${{ github.event.inputs.release_branch }} → ACC"
          body: |
            ## ACC Release

            Source Branch:
            `${{ github.event.inputs.release_branch }}`

            Target Branch:
            `Acc`

            ### Validation Completed
            - ✅ SonarQube Scan
            - ✅ Terraform Format
            - ✅ Terraform Validate
            - ✅ Terraform Plan

            Please review and merge this PR to deploy to ACC.
          draft: false
