replicaCount: 1

namespace: dev

image:
  repository: 103731055478.dkr.ecr.us-east-1.amazonaws.com/petclinic
  tag: 1.0.63
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

container:
  port: 8080

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

livenessProbe:
  path: /
  initialDelaySeconds: 60
  periodSeconds: 15

readinessProbe:
  path: /
  initialDelaySeconds: 30
  periodSeconds: 10

serviceAccount:
  create: false
  name: default
