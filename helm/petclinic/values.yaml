replicaCount: 1

namespace: dev

image:
  repository: 103731055478.dkr.ecr.us-east-1.amazonaws.com/petclinic
  tag: 1.0.68
  pullPolicy: Always

container:
  port: 8080

service:
  name: petclinic
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true

  className: nginx

  annotations: {}

  hosts:
    - host: petclinic.local
      paths:
        - path: /
          pathType: Prefix

  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

livenessProbe:
  path: /
  initialDelaySeconds: 60
  periodSeconds: 15

readinessProbe:
  path: /
  initialDelaySeconds: 30
  periodSeconds: 10

serviceAccount:
  create: false
  name: default
