replicaCount: 1

namespace: dev

image:
  repository: 103731055478.dkr.ecr.us-east-1.amazonaws.com/petclinic
  tag: 1.0.75
  pullPolicy: Always

container:
  port: 8080

service:
  name: petclinic
  type: LoadBalancer
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: petclinic.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: false
  name: default

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

livenessProbe:
  path: /
  initialDelaySeconds: 60
  periodSeconds: 15

readinessProbe:
  path: /
  initialDelaySeconds: 30
  periodSeconds: 10
