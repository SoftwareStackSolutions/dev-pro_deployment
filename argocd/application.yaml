apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: spring-petclinic-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/SoftwareStackSolutions/dev-pro_deployment.git
    targetRevision: Dev
    path: helm/petclinic

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
